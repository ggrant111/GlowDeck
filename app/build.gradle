plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glowdeck.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.glowdeck.tv'
        minSdk 23
        targetSdk 32 // Fire TV sideload compatibility; review before any store release.
        versionCode 5
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
